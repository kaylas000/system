[project]
name = "autogen-platform"
version = "0.1.0"
description = "Agentic Platform for automated project generation (see TECHNICAL_SPECIFICATION.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.20",
]

[project.scripts]
autogen-knowledge = "kernel.knowledge.cli:main"
autogen-costs = "kernel.llm.cost_report:main"

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.1"]
llm = ["litellm>=1.50", "tiktoken>=0.7"]
e2b = ["e2b>=2.0"]
ops = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
]
cli = ["click>=8.1", "httpx>=0.27", "websockets>=12", "rich>=13"]
knowledge = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "qdrant-client>=1.12",
    "pathspec>=0.12",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
    "python-hcl2>=7",
    "fakeredis>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel", "verticals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# skill hooks / gate parsers / tests contain long JSX snippets, regexes and fixtures
"verticals/**/hooks.py" = ["E501"]
"verticals/**/parsers.py" = ["E501"]
"tests/**" = ["E501"]
"scripts/**" = ["E501", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^specs/"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
