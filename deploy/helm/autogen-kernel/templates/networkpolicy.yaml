{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autogen-kernel.fullname" . }}
  labels:
    {{- include "autogen-kernel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autogen-kernel.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespaceLabel }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespaceLabel }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
