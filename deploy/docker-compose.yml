# Local / single-host stack (written by the agent). Not validated with `docker compose` in the
# development environment (no Docker) — structure is checked against the compose-spec schema in tests.
#
#   cp deploy/.env.example deploy/.env   # fill in keys
#   LLM gateway - pick one (see deploy/README.md "LLM"):
#     OmniRoute already running elsewhere:  LLM_GATEWAY_URL=http://host.docker.internal:20128/v1, no profile
#     OmniRoute in this stack:              --profile omniroute, LLM_GATEWAY_URL=http://omniroute:20128/v1
#     LiteLLM proxy in this stack:          --profile litellm (default LLM_GATEWAY_URL)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile omniroute up -d --build
#   docker compose -f deploy/docker-compose.yml --profile observability up -d   # + Prometheus/Grafana/Jaeger
#
# Kernel API :8000 (/docs, /metrics), OmniRoute dashboard 127.0.0.1:20128, LiteLLM 127.0.0.1:4000,
# Grafana :3000 (admin / $GRAFANA_ADMIN_PASSWORD), Jaeger :16686.
# Optional-profile services use ${VAR:-} (compose interpolates every service, even inactive ones).
name: autogen

x-restart: &restart
  restart: unless-stopped

services:
  kernel:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.kernel
    image: ${KERNEL_IMAGE:-autogen-kernel:local}
    ports: ["${KERNEL_PORT:-8000}:8000"]
    environment:
      # Any OpenAI-compatible gateway; model names are sent verbatim, LLM_MODEL_ALIASES maps them (JSON)
      AUTOGEN_LLM__GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
      AUTOGEN_LLM__API_KEY: ${LLM_API_KEY:?set LLM_API_KEY (OmniRoute key or LiteLLM master key)}
      AUTOGEN_LLM__MODEL_ALIASES: ${LLM_MODEL_ALIASES:-}
      AUTOGEN_LLM__EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      AUTOGEN_KNOWLEDGE__EMBEDDER: ${EMBEDDER:-}
      AUTOGEN_KNOWLEDGE__EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      AUTOGEN_KNOWLEDGE__EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      AUTOGEN_DATABASE__POSTGRES_DSN: postgresql://autogen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/autogen
      AUTOGEN_VECTOR_DB__QDRANT_URL: http://qdrant:6333
      AUTOGEN_SANDBOX__PROVIDER: ${SANDBOX_PROVIDER:-e2b}
      AUTOGEN_SANDBOX__API_KEY: ${E2B_API_KEY:-}
      AUTOGEN_BUDGET__MAX_COST_USD_PER_DAY: ${MAX_COST_USD_PER_DAY:-}
      AUTOGEN_BUDGET__MAX_COST_USD_PER_RUN: ${MAX_COST_USD_PER_RUN:-}
      AUTOGEN_BUDGET__ALERT_WEBHOOK_URL: ${BUDGET_ALERT_WEBHOOK_URL:-}
      AUTOGEN_OBSERVABILITY__OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      AUTOGEN_OBSERVABILITY__LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # Gateway /v1: keys via `docker compose exec kernel python -m kernel.main keys create --tenant dev --user me`
      AUTOGEN_GATEWAY__AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      AUTOGEN_GATEWAY__REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      AUTOGEN_GATEWAY__JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      AUTOGEN_GATEWAY__WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach an OmniRoute running on the host
    volumes:
      - kernel-data:/data
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_healthy}
      litellm: {condition: service_healthy, required: false}
      omniroute: {condition: service_started, required: false}

  # --- LLM gateway, option 1: OmniRoute (profile) -----------------------------------------------
  # First start: open the dashboard, log in with OMNIROUTE_INITIAL_PASSWORD, connect providers,
  # Endpoints -> create an API key -> LLM_API_KEY, then `docker compose up -d kernel`.
  omniroute:
    <<: *restart
    profiles: [omniroute]
    image: diegosouzapw/omniroute:3.8.50
    ports: ["127.0.0.1:${OMNIROUTE_PORT:-20128}:20128"]
    stop_grace_period: 40s
    environment:
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-}
    volumes:
      - omniroute-data:/app/data

  # --- LLM gateway, option 2: LiteLLM proxy (profile) -------------------------------------------
  litellm:
    <<: *restart
    profiles: [litellm]
    image: ghcr.io/berriai/litellm:v1.102.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autogen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: autogen
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autogen -d autogen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage

  # --- observability (profile) ----------------------------------------------------------------
  otel-collector:
    <<: *restart
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    <<: *restart
    profiles: [observability]
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  prometheus:
    <<: *restart
    profiles: [observability]
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  grafana:
    <<: *restart
    profiles: [observability]
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  kernel-data:
  postgres-data:
  redis-data:
  qdrant-data:
  omniroute-data:
  prometheus-data:
  grafana-data:
