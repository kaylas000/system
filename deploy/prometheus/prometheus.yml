global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: autogen-kernel
    metrics_path: /metrics
    static_configs:
      - targets: ["kernel:8000"]
  - job_name: litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ["litellm:4000"]
